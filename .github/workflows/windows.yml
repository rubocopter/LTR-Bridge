name: Windows harness

on:
  push:
  pull_request:

jobs:
  phase1-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release
      - name: Run deterministic readback test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload deterministic readback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-harness-selftest
          path: |
            build/cmake/ltr_harness_selftest.txt
            build/cmake/ltr_diag_*.bmp
          if-no-files-found: warn
