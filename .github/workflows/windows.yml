name: Windows validation

on:
  push:
  pull_request:

jobs:
  phase1-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release
      - name: Run deterministic probes
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload deterministic probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-harness-selftest
          path: |
            build/cmake/ltr_harness_selftest.txt
            build/cmake/ltr_diag_*.bmp
            build/src/optical_flow/ltr_optical_flow_probe.txt
            build/src/optical_flow/ltr_diag_optical_*.bmp
          if-no-files-found: warn

  optional-probe-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32 native probes
        run: >-
          cmake -S . -B build-probes-x86 -A Win32
          -DLTR_ENABLE_X86_X64_BRIDGE_PROBE=ON
          -DLTR_ENABLE_D3D9_D3D11_SHARE_PROBE=ON
          -DLTR_ENABLE_D3D9EX_SCENE_PROBE=ON
          -DLTR_ENABLE_D3D9EX_INTERCEPT_PROBE=ON
          -DLTR_ENABLE_D3D10_D3D11_RELAY_PROBE=ON
      - name: Build Win32 native probes
        run: cmake --build build-probes-x86 --config Release
      - name: Configure x64 bridge consumer
        run: cmake -S . -B build-probes-x64 -A x64 -DLTR_ENABLE_X86_X64_BRIDGE_PROBE=ON
      - name: Build x64 bridge consumer
        run: cmake --build build-probes-x64 --config Release --target ltr_x86_x64_bridge_consumer
